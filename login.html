<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Panel Claudette</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="body-login">

  <main class="main-login">

    <section class="caja-login">

      <img class="logo-login" src="../img/ui/logo.png" alt="Claudette">

      <h1>Panel de administracion</h1>

      <form class="formulario" action="#" method="post">

        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" required>
        </div>

        <div class="campo">
          <label for="password">Contrasena</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button class="boton-primario" type="submit">Ingresar</button>

      </form>

      <a class="link-volver" href="../index.html">Volver al sitio</a>

    </section>

  </main>

</body>
</html>
