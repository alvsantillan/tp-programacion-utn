<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto | Panel Claudette</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="body-admin">

  <!-- ===== HEADER ADMIN (igual en todas las paginas del panel) ===== -->
  <header class="header-admin">
    <span class="logo-admin">Claudette</span>

    <nav class="nav-admin">
      <ul>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="login.html">Cerrar sesion</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== CONTENIDO ===== -->
  <main class="main-admin">

    <section class="admin-encabezado">
      <h1>Nuevo producto</h1>
      <a class="link-volver" href="productos.html">Volver al listado</a>
    </section>

    <form class="formulario formulario-producto" action="#" method="post" enctype="multipart/form-data">

      <!-- Datos basicos -->
      <fieldset>
        <legend>Datos del producto</legend>

        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
          <label for="descripcion">Descripcion</label>
          <textarea id="descripcion" name="descripcion" rows="5"></textarea>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required>
            <option value="">Elegi una categoria</option>
            <option value="remeras">Remeras</option>
            <option value="pantalones">Pantalones</option>
            <option value="vestidos">Vestidos</option>
            <option value="abrigos">Abrigos</option>
            <option value="accesorios">Accesorios</option>
          </select>
        </div>

        <div class="campo">
          <label for="color">Color</label>
          <input type="text" id="color" name="color">
        </div>

      </fieldset>

      <!-- Precio y stock -->
      <fieldset>
        <legend>Precio y stock</legend>

        <div class="campo">
          <label for="precio">Precio</label>
          <input type="number" id="precio" name="precio" min="0" step="0.01" required>
        </div>

        <div class="campo">
          <label for="stock">Stock total</label>
          <input type="number" id="stock" name="stock" min="0" required>
        </div>

      </fieldset>

      <!-- Talles -->
      <fieldset>
        <legend>Talles disponibles</legend>

        <div class="campo-checkbox">
          <input type="checkbox" id="talle-xs" name="talles[]" value="XS">
          <label for="talle-xs">XS</label>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="talle-s" name="talles[]" value="S">
          <label for="talle-s">S</label>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="talle-m" name="talles[]" value="M">
          <label for="talle-m">M</label>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="talle-l" name="talles[]" value="L">
          <label for="talle-l">L</label>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="talle-xl" name="talles[]" value="XL">
          <label for="talle-xl">XL</label>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="talle-unico" name="talles[]" value="U">
          <label for="talle-unico">Talle unico</label>
        </div>

      </fieldset>

      <!-- Imagenes -->
      <fieldset>
        <legend>Imagenes</legend>

        <div class="campo">
          <label for="imagenes">Fotos del producto</label>
          <input type="file" id="imagenes" name="imagenes[]" accept="image/*" multiple>
        </div>

      </fieldset>

      <!-- Publicacion -->
      <fieldset>
        <legend>Publicacion</legend>

        <div class="campo-checkbox">
          <input type="checkbox" id="publicado" name="publicado" value="1" checked>
          <label for="publicado">Mostrar en el catalogo</label>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="destacado" name="destacado" value="1">
          <label for="destacado">Marcar como destacado</label>
        </div>

      </fieldset>

      <div class="acciones-formulario">
        <button class="boton-primario" type="submit">Guardar producto</button>
        <a class="boton-secundario" href="productos.html">Cancelar</a>
      </div>

    </form>

  </main>

</body>
</html>
